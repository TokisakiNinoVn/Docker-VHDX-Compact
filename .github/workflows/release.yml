name: Build installer

on:
  push:
    tags: ["v*.*.*"]      # e.g. git tag v1.0.0 && git push nino v1.0.0
  workflow_dispatch:       # manual test build (artifact only, no release)

permissions:
  contents: write          # needed to create the GitHub Release

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell  # Windows PowerShell 5.1, same as the tool's target

    steps:
      - uses: actions/checkout@v4

      - name: Work out version
        id: ver
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $v = "0.0.${{ github.run_number }}"
          }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Tag must look like v1.2.3 (got '$v')." }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Version: $v"

      - name: Install Inno Setup (if missing)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed." }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }

      # Checks script syntax + UI strings, compiles DockerCompact.exe,
      # then builds the installer and its .sha256 file.
      - name: Build
        run: |
          .\build.ps1 -Version "${{ steps.ver.outputs.version }}"
          $setup = "dist\DockerCompact-Setup-${{ steps.ver.outputs.version }}.exe"
          if (-not (Test-Path $setup)) { throw "Installer was not built: $setup" }
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: DockerCompact-Setup-${{ steps.ver.outputs.version }}
          path: dist/DockerCompact-Setup-*

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @(Get-ChildItem dist\DockerCompact-Setup-* | ForEach-Object { $_.FullName })
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "Docker VHDX Compact $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed." }
