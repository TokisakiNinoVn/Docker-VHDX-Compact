name: Build installer

# Releases are created by hand on GitHub; this workflow only builds the
# installer and puts it into the Release.
#
# 1. A Release is published on GitHub (e.g. v1.3.0)
#    -> build the tagged commit and attach the installer to that Release.
# 2. A pull request from "dev" is merged into "main" (version = VERSION file):
#    - tag v<VERSION> exists -> build the merge commit, move the tag to it and
#      replace the installer in that Release;
#    - tag v<VERSION> does not exist -> skip the build (the run succeeds).
on:
  release:
    types: [published]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:       # manual test build (artifact only, no release)

permissions:
  contents: write          # needed to move the tag and upload to the Release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'dev' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell  # Windows PowerShell 5.1, same as the tool's target
    env:
      # For a merged PR, build exactly the merge commit that landed on main;
      # for a published Release, github.sha is the tagged commit.
      BUILD_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_SHA }}

      # mode: fill (Release published) | update (merge, tag exists)
      #       skip (merge, no tag) | test (run by hand)
      - name: Work out version
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $file = (Get-Content VERSION -Raw).Trim()
          if ($env:EVENT -eq "release") {
            $tag = $env:RELEASE_TAG
            $v = $tag -replace '^v', ''
            if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Release tag must look like v1.2.3 (got '$tag')." }
            if ($v -ne $file) { "::warning::Release $tag but VERSION in that commit is $file. Building as $v." }
            $mode = "fill"
          } else {
            $v = $file
            if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION must look like 1.2.3 (got '$v')." }
            $tag = "v$v"
            $mode = "test"
            if ($env:EVENT -eq "pull_request") {
              # cmd /c keeps git's stderr away from PowerShell's error handling.
              cmd /c "git ls-remote --exit-code --tags origin refs/tags/$tag >nul 2>&1"
              if ($LASTEXITCODE -eq 0) {
                $mode = "update"
                "::notice::Building ${tag}: the tag moves to this merge and the installer in its Release is replaced."
              } else {
                $mode = "skip"
                "::notice::Tag $tag does not exist, so nothing is built. Publish the Release $tag on GitHub to build it."
              }
            }
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "mode=$mode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Version: $v, mode: $mode"

      - name: Install Inno Setup (if missing)
        if: steps.ver.outputs.mode != 'skip'
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed." }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }

      # Checks script syntax + UI strings, compiles DockerCompact.exe,
      # then builds the installer and its .sha256 file.
      - name: Build
        if: steps.ver.outputs.mode != 'skip'
        run: |
          .\build.ps1 -Version "${{ steps.ver.outputs.version }}"
          $setup = "dist\DockerCompact-Setup-${{ steps.ver.outputs.version }}.exe"
          if (-not (Test-Path $setup)) { throw "Installer was not built: $setup" }
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        if: steps.ver.outputs.mode != 'skip'
        with:
          name: DockerCompact-Setup-${{ steps.ver.outputs.version }}
          path: dist/DockerCompact-Setup-*

      - name: Publish GitHub Release
        if: steps.ver.outputs.mode == 'update' || steps.ver.outputs.mode == 'fill'
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $files = @(Get-ChildItem dist\DockerCompact-Setup-* | ForEach-Object { $_.FullName })
          if ("${{ steps.ver.outputs.mode }}" -eq "update") {
            # Merge without a version bump: move the tag to the code just built.
            cmd /c "git tag -f $tag $env:BUILD_SHA 2>&1"
            if ($LASTEXITCODE -ne 0) { throw "git tag failed." }
            cmd /c "git push --force origin refs/tags/${tag}:refs/tags/$tag 2>&1"
            if ($LASTEXITCODE -ne 0) { throw "Moving tag $tag failed." }
          }

          cmd /c "gh release view $tag >nul 2>&1"
          if ($LASTEXITCODE -eq 0) {
            # Keep the Release text, add or replace the installer and its checksum.
            gh release upload $tag @files --clobber
          } else {
            # Tag without a Release (e.g. pushed with git): create the Release.
            gh release create $tag @files --verify-tag --title "Docker VHDX Compact $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed." }
          "Installer published to $tag (tag now at $env:BUILD_SHA)."
